name: Render Online if Pc sucks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Get Starless
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render black hole
        env:
          MPLBACKEND: Agg
          STARLESS_BACKEND: numpy
        run: |
          python3 tracer.py --no-bs blackhole.scene

      - name: Upload Gargantua
        uses: actions/upload-artifact@v4
        with:
          name: Gargantua-render
          path: tests/out.png
          if-no-files-found: error
